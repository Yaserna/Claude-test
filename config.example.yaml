# Sample config - copy to config.yaml and adjust values.
# CHANGE_ME values must be filled in before running.

device:
  serial: ""                      # empty = first ADB device
  package: "CHANGE_ME"            # Acki Nacki wallet app package name

telegram:
  package: "org.telegram.messenger"
  logins_per_account: 400         # rotate account after this many successful logins
  login_ok_marker: "You have successfully logged into Acki Nacki"
  fresh_window_minutes: 2         # message counts only if its HH:MM is this close to the clock
  profile_longpress_ms: 300       # long-press duration on the bottom-bar profile tab
  strip_country_code: "98"        # 989035505155 -> 9035505155
  detect_account_on_start: true   # restart Telegram at startup and read the active account
  max_accounts: 10                # rotation wraps back to row 1 after this many accounts

waits:
  action_delay: 0.3
  telegram: 12          # wait after tapping ZK Login (Telegram round-trip)
  login_recheck: 20     # wait after relaunch before verifying we left ZK
  empty_poll: 30
  render: 1.5
  scan_interval: 1
  unknown_timeout: 45
  deploy_timeout: 60
  logout_wait: 60
  name_no_text: 10
  tg_render: 2          # wait after opening Telegram
  tg_switch_wait: 3     # wait after tapping another account
  tg_login_ok_timeout: 15   # max seconds to wait for a fresh success message
  tg_main_ready_timeout: 30 # max seconds to wait for the Telegram bottom bar to load

tuning:
  name_poll_gap: 0.7
  checkbox_offset_ratio: 0.08
  gear_region: [0.82, 0.03, 0.99, 0.12]

files:
  names: "names.txt"
  taken: "taken.txt"
  wallets: "wallets.txt"              # default file (used until an account is known)
  wallets_dir: "wallets_by_account"   # per-account files: <dir>/<account>.txt
  password: "password.txt"
  state: "state.json"
  stop: "stop.txt"

logging:
  dir: "logs"
  level: "INFO"
  stats_every: 300
