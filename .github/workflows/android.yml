name: Build APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 29.0.13846066
        run: sdkmanager "ndk;29.0.13846066"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_LABEL: ${{ github.run_number }}
        run: ./gradlew :app:assembleDebug

      - name: Rename APK for this project
        run: cp app/build/outputs/apk/debug/app-debug.apk InfinityClone.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InfinityClone
          path: InfinityClone.apk
          if-no-files-found: warn

      - name: Publish APK to project release
        if: github.ref == 'refs/heads/Cloner'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: infinityclone-latest
          name: InfinityClone — Latest debug build
          prerelease: true
          files: InfinityClone.apk
